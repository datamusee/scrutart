{% extends "base.html" %}
{% block contenu %}
<h1>Connexion</h1>
{% if erreur %}<p class="message erreur">{{ erreur }}</p>{% endif %}
<form method="post" action="{{ url_for('connexion') }}" autocomplete="off">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Identifiant <input name="username" required autocomplete="username"></label>
  <label>Mot de passe <input name="password" type="password" required autocomplete="current-password"></label>
  <label>Code à 6 chiffres (application d'authentification)
    <input name="totp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code">
  </label>
  <button type="submit">Se connecter</button>
</form>
{% endblock %}
